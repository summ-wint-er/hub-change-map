<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 거점 지도 (VWorld 베이스맵)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#F1EFE6; --surface:#FBFAF5; --border:#DDD7C6;
    --ink:#20241E; --ink-secondary:#5B6156; --ink-muted:#8C8A7B;
    --t1:#AEDCD4; --t2:#5FB4AA; --t3:#1E8078; --t4:#0A433E;
    --d1:#F0C9A8; --d2:#DC9A62; --d3:#B65A2E; --d4:#6E2F12;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#13150F; --surface:#1A1D16; --border:#333527;
      --ink:#ECE9DD; --ink-secondary:#B6B2A0; --ink-muted:#82806D;
      --t1:#2E6F65; --t2:#3F9C8E; --t3:#57D2BF; --t4:#A8FBE8;
      --d1:#6E4A34; --d2:#A8623A; --d3:#E2A06B; --d4:#FFD9B0;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Malgun Gothic',sans-serif;}
  .app{display:grid;grid-template-columns:1fr 300px;height:100vh;}
  #map{width:100%;height:100%;background:var(--bg);}
  aside{
    padding:16px;overflow-y:auto;border-left:1px solid var(--border);background:var(--surface);
  }
  h1{font-size:17px;margin:0 0 4px;}
  .sub{color:var(--ink-secondary);font-size:12.5px;margin:0 0 16px;}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .stat .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .label{font-size:12px;color:var(--ink-secondary);}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;cursor:pointer;}
  .legend-row.off{opacity:0.35;}
  .sw{width:11px;height:11px;border-radius:3px;flex:none;}
  h2{font-size:13px;margin:18px 0 8px;color:var(--ink-secondary);text-transform:uppercase;letter-spacing:.04em;}
  .legend-group{font-size:11px;color:var(--ink-muted);margin:10px 0 4px;}
  .legend-group:first-child{margin-top:0;}
  .tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:12px;}
  .tabs button{
    flex:1;padding:7px 8px;border:none;border-radius:6px;background:transparent;
    color:var(--ink-secondary);font-size:12.5px;font-family:inherit;cursor:pointer;
  }
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12);}
  #year-picker,#rank-picker{margin-bottom:12px;}
  #year-picker select,#rank-picker select{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;
    background:var(--bg);color:var(--ink);font-size:13px;font-family:inherit;
  }
  #year-picker label,#rank-picker label{display:block;font-size:11px;color:var(--ink-muted);margin-bottom:4px;}
  #rank-hint{font-size:11px;color:var(--ink-muted);line-height:1.45;margin:6px 0 0;}
  [hidden]{display:none !important;}
  /* 팝업: Leaflet 기본은 흰 배경 고정이라 다크 모드에서 글자가 안 보임 -> 테마 토큰 사용 */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);}
  .leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.45;}
  .pop-head{font-weight:700;font-size:13.5px;}
  .pop-sub{color:var(--ink-muted);font-size:11.5px;margin-bottom:6px;}
  .pop-tier{margin-bottom:8px;}
  table.metrics{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
  table.metrics th,table.metrics td{padding:4px 6px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;}
  table.metrics thead th{border-top:none;color:var(--ink-muted);font-weight:500;font-size:11px;}
  table.metrics tbody th{text-align:left;font-weight:500;color:var(--ink-secondary);}
  .unit{color:var(--ink-muted);font-size:11px;}
  .dup{color:var(--t3);font-weight:600;}
  .ddown{color:var(--d3);font-weight:600;}
  .d0{color:var(--ink-muted);}
  .pop-note{color:var(--ink-muted);font-size:11px;margin-top:6px;}
  .pop-note + .pop-note{margin-top:2px;}
  ol{list-style:none;margin:0;padding:0;}
  li{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border);}
  li .val{color:var(--ink-secondary);font-variant-numeric:tabular-nums;}
  /* 폰: 사이드바 300px 고정이면 지도가 90px로 줄어들어 세로 배치로 전환 (지도 위, 패널 아래로 스크롤) */
  @media (max-width: 760px){
    .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;}
    aside{overflow-y:visible;border-left:none;border-top:1px solid var(--border);}
  }
  #key-banner{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
    background:#B4232399;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;max-width:70%;
    display:none;
  }
</style>
</head>
<body>
<div class="app">
  <div style="position:relative;">
    <div id="key-banner"></div>
    <div id="map"></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button id="tab-change" role="tab" aria-selected="true">등급 변화</button>
      <button id="tab-status" role="tab" aria-selected="false">단일 시점 현황</button>
    </div>

    <div id="year-picker" hidden>
      <label for="year-select">기준 연도</label>
      <select id="year-select">
        <option value="2025">2025년</option>
        <option value="2021">2021년</option>
      </select>
    </div>

    <h1 id="panel-title">거점 등급 변화 지도</h1>
    <p class="sub" id="panel-sub">2021 → 2025년 사이 국토공간거점 등급이 오르내린 격자 (VWorld 베이스맵)</p>
    <div class="stat"><div class="num" id="stat-total">-</div><div class="label" id="stat-label">등급 변화 격자 수</div></div>
    <h2 id="legend-title">등급 변화 (클릭해 필터)</h2>
    <div id="legend"></div>
    <h2 id="rank-title">변화 상위 시군구</h2>
    <div id="rank-picker" hidden>
      <label for="rank-select">순위 기준</label>
      <select id="rank-select">
        <option value="count">중심지 격자 수</option>
        <option value="ratio">중심지 비율 (면적 보정)</option>
        <option value="weighted">등급 가중 점수</option>
        <option value="filtered">범례에서 선택한 등급만</option>
      </select>
      <p id="rank-hint"></p>
    </div>
    <ol id="rank-list"></ol>
  </aside>
</div>

<script>
// ---- VWorld API 키 설정 ----
// 1) https://www.vworld.kr 에서 오픈API 인증키 발급 (무료)
// 2) 발급 시 등록한 도메인에서만 동작 (file://는 불가) -> 아래 방법으로 로컬 서버를 띄워서 열 것:
//      프로젝트 루트에서: python3 -m http.server 8000
//      브라우저에서: http://localhost:8000/web/center_change_map.html
//    VWorld 키 등록 도메인에 localhost(또는 127.0.0.1)를 추가해야 함.
const VWORLD_KEY = "D2460A0F-B949-39FD-9FF4-706F0082783E";

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// 변화 방향(up/down) x 크기(1~4단계)로 색을 정한다 - 상향은 청록, 하향은 적갈 계열(발산 팔레트).
function changeKey(direction, magnitude){ return direction + magnitude; }
function changeColor(direction, magnitude){
  const varName = (direction === 'up' ? '--t' : '--d') + magnitude;
  return cssVar(varName);
}
function changeLabel(direction, magnitude){
  return (direction === 'up' ? '상향 ' : '하향 ') + magnitude + '단계';
}

// 단일 시점 현황: 중심지 등급이 높을수록 진한 청록 (주변부는 데이터에서 제외)
const TIER_ORDER = ["중심지Ⅲ-2","중심지Ⅲ-1","중심지Ⅱ","중심지Ⅰ"];
const TIER_LABEL = {
  "중심지Ⅲ-2":"중심지 Ⅲ-2 (인구집적지)", "중심지Ⅲ-1":"중심지 Ⅲ-1 (고용집적지)",
  "중심지Ⅱ":"중심지 Ⅱ (준거점·부심)", "중심지Ⅰ":"중심지 Ⅰ (거점·도심)"
};

// ---- 클릭 팝업: 등급 판정 근거 지표 (메타데이터 xlsx 기준) ----
const METRICS = [
  { key: 'pc_in',  label: '유입 중심성 지수', fmt: fmtIndex },
  { key: 'pc_out', label: '유출 중심성 지수', fmt: fmtIndex },
  { key: 'pop_r',  label: '거주인구 밀도',   fmt: fmtPop, unit: '명/km²' },
  { key: 'pop_w',  label: '근무인구 밀도',   fmt: fmtPop, unit: '명/km²' },
];
// 중심성 지수는 0.004~70으로 범위가 넓어 1 미만은 유효숫자 3자리로
function fmtIndex(v){ return v === 0 ? '0' : (Math.abs(v) >= 1 ? v.toFixed(2) : v.toPrecision(3)); }
function fmtPop(v){ return Math.round(v).toLocaleString('ko-KR'); }
function fmtDelta(v, fmt){
  if (v === 0) return '<span class="d0">0</span>';
  return `<span class="${v > 0 ? 'dup' : 'ddown'}">${v > 0 ? '+' : '−'}${fmt(Math.abs(v))}</span>`;
}

function popupHtml(p){
  const head = `<div class="pop-head">${p.sido_nm} ${p.sgg_nm}</div><div class="pop-sub">격자 ${p.gid}</div>`;
  const note = '<div class="pop-note">중심성 지수: 1 = 중간 수준, 1 초과 시 중심부 위상</div>';
  if (mode === 'change'){
    const arrow = p.direction === 'up' ? '▲' : '▼';
    const rows = METRICS.map(m => {
      const a = p[m.key + '_2021'], b = p[m.key + '_2025'];
      return `<tr><th>${m.label}</th><td>${m.fmt(a)}</td><td>${m.fmt(b)}</td><td>${fmtDelta(b - a, m.fmt)}</td></tr>`;
    }).join('');
    return `${head}<div class="pop-tier">${p.type_2021} → <b>${p.type_2025}</b> <span class="${p.direction === 'up' ? 'dup' : 'ddown'}">${arrow} ${p.magnitude}단계</span></div>
      <table class="metrics"><thead><tr><th></th><th>2021</th><th>2025</th><th>변화</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="pop-note">인구 밀도 단위: 명/km²</div>${note}`;
  }
  const rows = METRICS.map(m =>
    `<tr><th>${m.label}</th><td>${m.fmt(p[m.key])}${m.unit ? ' <span class="unit">' + m.unit + '</span>' : ''}</td></tr>`
  ).join('');
  return `${head}<div class="pop-tier">${year}년 · <b>${TIER_LABEL[p.tier]}</b></div>
    <table class="metrics"><tbody>${rows}</tbody></table>${note}`;
}
function tierColor(tier){ return cssVar('--t' + (TIER_ORDER.indexOf(tier) + 1)); }

if (!VWORLD_KEY || VWORLD_KEY === "YOUR_VWORLD_API_KEY"){
  const b = document.getElementById('key-banner');
  b.style.display = 'block';
  b.textContent = 'VWorld API 키가 설정되지 않았습니다 — 지도 타일이 보이지 않습니다. 이 파일 상단의 VWORLD_KEY를 발급받은 키로 바꾸세요.';
}

// preferCanvas: 단일 시점 현황은 격자가 17,000개라 SVG 렌더러로는 버벅임
const map = L.map('map', { zoomControl: true, preferCanvas: true }).fitBounds([[32.9,124.4],[38.7,132.1]]);

const VWORLD_ATTR = '&copy; <a href="https://www.vworld.kr">국토지리정보원 VWorld</a>';
function vworldLayer(layerName, ext){
  return L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layerName}/{z}/{y}/{x}.${ext}`, {
    maxZoom: 19, minZoom: 6, attribution: VWORLD_ATTR
  });
}

// 시군구 경계: 격자(overlayPane, z 400) 위에 그리도록 전용 pane을 두고, 클릭은 아래 격자로 통과시킨다.
map.createPane('boundaries');
map.getPane('boundaries').style.zIndex = 450;
map.getPane('boundaries').style.pointerEvents = 'none';
const boundaryRenderer = L.canvas({ pane: 'boundaries' });
// 흰 외곽선 위에 진한 선을 겹쳐 일반지도·위성지도 어디서나 보이게 함 (베이스맵 타일은 테마와 무관하게 밝거나 어두우므로 고정색)
const boundaryCasing = L.geoJSON(null, {
  renderer: boundaryRenderer, interactive: false,
  style: { color: '#FFFFFF', weight: 4, opacity: 0.85, lineCap: 'square' }
});
const boundaryLine = L.geoJSON(null, {
  renderer: boundaryRenderer, interactive: false,
  style: { color: '#3A3A44', weight: 1.8, opacity: 0.95, lineCap: 'square' }
});
const boundaryLayer = L.layerGroup([boundaryCasing, boundaryLine]);

// 전국 축척에서 두꺼운 선을 그리면 지도가 선으로 뒤덮이므로 확대할수록 굵게
function styleBoundaries(){
  const z = map.getZoom();
  const [casing, line] = z <= 8 ? [0, 0.8] : z <= 10 ? [2.5, 1.2] : [4, 1.8];
  boundaryCasing.setStyle({ weight: casing });
  boundaryLine.setStyle({ weight: line, opacity: z <= 8 ? 0.6 : 0.95 });
}
map.on('zoomend', styleBoundaries);
fetch('../data/output/sgg_boundaries_4326.geojson')
  .then(r => r.json())
  .then(gj => { boundaryCasing.addData(gj); boundaryLine.addData(gj); styleBoundaries(); })
  .catch(() => {});

const baseLayers = {
  '일반지도': vworldLayer('Base', 'png'),
  '백지도': vworldLayer('white', 'png'),
  '위성지도': vworldLayer('Satellite', 'jpeg')
};
const overlayLayers = {
  '시군구 경계(격자 근사)': boundaryLayer,
  '위성 라벨': vworldLayer('Hybrid', 'png')
};
baseLayers['일반지도'].addTo(map);
boundaryLayer.addTo(map);
L.control.layers(baseLayers, overlayLayers, { position: 'topright' }).addTo(map);

// ---- 모드/연도 상태 ----
let mode = 'change';          // 'change' | 'status'
let year = '2025';
let geoLayer = null;
let currentGeojson = null;
const activeKeys = new Set();  // 현재 모드에서 켜져 있는 범례 항목
const cache = {};              // url -> geojson

// 모드별로 피처가 어떤 범례 항목에 속하는지
function featureKey(p){
  return mode === 'change' ? changeKey(p.direction, p.magnitude) : p.tier;
}
function featureColor(p){
  return mode === 'change' ? changeColor(p.direction, p.magnitude) : tierColor(p.tier);
}

function dataUrl(){
  return mode === 'change'
    ? '../data/output/tier_change_2021_2025.geojson'
    : `../data/output/tier_status_${year}.geojson`;
}

function showError(url){
  const b = document.getElementById('key-banner');
  b.style.display = 'block';
  b.style.background = '#B4232399';
  b.textContent = `${url} 를 불러오지 못했습니다. file://로 직접 열면 fetch가 막히니 로컬 서버(python3 -m http.server)로 열어주세요.`;
}

function loadAndRender(){
  const url = dataUrl();
  document.getElementById('stat-total').textContent = '…';
  const promise = cache[url]
    ? Promise.resolve(cache[url])
    : fetch(url).then(r => r.json()).then(gj => (cache[url] = gj));

  promise.then(geojson => {
    currentGeojson = geojson;
    activeKeys.clear();
    geojson.features.forEach(f => activeKeys.add(featureKey(f.properties)));
    document.getElementById('stat-total').textContent = geojson.features.length.toLocaleString('ko-KR');
    buildLegend(geojson);
    buildRankList(geojson);
    renderLayer();
  }).catch(() => showError(url));
}

function renderLayer(){
  if (geoLayer) map.removeLayer(geoLayer);
  const filtered = {
    type: 'FeatureCollection',
    features: currentGeojson.features.filter(f => activeKeys.has(featureKey(f.properties)))
  };
  geoLayer = L.geoJSON(filtered, {
    style: f => {
      const c = featureColor(f.properties);
      // 현황 모드는 격자가 서로 붙어 있어 테두리를 그리면 색이 뭉개짐
      return { color: c, weight: mode === 'change' ? 1 : 0, fillColor: c, fillOpacity: 0.8 };
    },
    onEachFeature: (f, layer) => {
      const p = f.properties;
      const head = `<b>${p.sido_nm} ${p.sgg_nm}</b><br>격자 ${p.gid}<br>`;
      if (mode === 'change'){
        const arrow = p.direction === 'up' ? '▲' : '▼';
        layer.bindTooltip(`${head}${p.type_2021} → ${p.type_2025} (${arrow} ${p.magnitude}단계)`);
      } else {
        layer.bindTooltip(`${head}${year}년 ${TIER_LABEL[p.tier]}`);
      }
    }
  }).addTo(map);

  // 격자마다 팝업을 붙이면 현황 모드에서 17,000개가 생기므로 레이어 그룹에 클릭 핸들러 하나만 둔다
  geoLayer.on('click', e => {
    L.popup({ maxWidth: Math.min(360, window.innerWidth - 48) }).setLatLng(e.latlng).setContent(popupHtml(e.layer.feature.properties)).openOn(map);
  });
}

function legendRow(key, color, label, count){
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `<span class="sw" style="background:${color}"></span><span>${label}</span><span style="margin-left:auto;color:var(--ink-muted)">${count.toLocaleString('ko-KR')}</span>`;
  row.addEventListener('click', () => {
    if (activeKeys.has(key)) activeKeys.delete(key); else activeKeys.add(key);
    row.classList.toggle('off', !activeKeys.has(key));
    renderLayer();
    buildRankList(currentGeojson);  // '선택 등급만' 순위 기준이 범례를 따라가도록
  });
  return row;
}

function buildLegend(geojson){
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  const counts = {};
  geojson.features.forEach(f => {
    const k = featureKey(f.properties);
    counts[k] = (counts[k] || 0) + 1;
  });

  if (mode === 'status'){
    // 상위 등급부터
    TIER_ORDER.slice().reverse().forEach(tier => {
      if (!counts[tier]) return;
      legend.appendChild(legendRow(tier, tierColor(tier), TIER_LABEL[tier], counts[tier]));
    });
    return;
  }

  function addGroup(direction, title){
    const present = [1,2,3,4].filter(m => counts[changeKey(direction, m)] > 0);
    if (!present.length) return;
    const h = document.createElement('div');
    h.className = 'legend-group';
    h.textContent = title;
    legend.appendChild(h);
    // 상향은 큰 단계부터(강조), 하향도 큰 단계부터
    present.slice().reverse().forEach(m => {
      const key = changeKey(direction, m);
      legend.appendChild(legendRow(key, changeColor(direction, m), changeLabel(direction, m), counts[key]));
    });
  }
  addGroup('up', '중심지 등급 상향');
  addGroup('down', '중심지 등급 하향 · 중심지 이탈');
}

const RANK_HINT = {
  count:    '등급 구분 없이 중심지 격자 개수를 셈. 면적이 넓은 시군구가 유리함.',
  ratio:    '시군구 전체 격자(주변부 포함) 중 중심지 비율. 면적 차이를 보정하지만 격자가 적은 도심 구가 100%로 몰릴 수 있어, 비율이 같으면 격자 수가 많은 순.',
  weighted: 'Ⅰ=4, Ⅱ=3, Ⅲ-1=2, Ⅲ-2=1점으로 가중 합산. 거점의 위계를 반영함.',
  filtered: '범례에서 켜 둔 등급의 격자만 셈. 범례를 클릭하면 순위가 바로 바뀜.',
};

// rows: [{key:'시도|시군구', val:'표시값'}]
function renderRankRows(rows){
  const list = document.getElementById('rank-list');
  list.innerHTML = '';
  if (!rows.length){
    list.innerHTML = '<li><span style="color:var(--ink-muted)">범례에서 켜 둔 등급이 없습니다</span></li>';
    return;
  }
  rows.forEach(({key, val}, i) => {
    const [sido, sgg] = key.split('|');
    const li = document.createElement('li');
    li.innerHTML = `<span>${i+1}. ${sgg} <span style="color:var(--ink-muted)">${sido}</span></span><span class="val">${val}</span>`;
    list.appendChild(li);
  });
}

function buildRankList(geojson){
  if (mode === 'change'){
    const counts = {};
    geojson.features.forEach(f => {
      const key = f.properties.sido_nm + '|' + f.properties.sgg_nm;
      if (!counts[key]) counts[key] = { up: 0, down: 0 };
      counts[key][f.properties.direction]++;
    });
    renderRankRows(Object.entries(counts)
      .sort((a,b) => (b[1].up + b[1].down) - (a[1].up + a[1].down))
      .slice(0,10)
      .map(([key, c]) => ({ key, val: `▲${c.up} ▼${c.down}` })));
    return;
  }

  const crit = document.getElementById('rank-select').value;
  document.getElementById('rank-hint').textContent = RANK_HINT[crit];
  const totals = geojson.sgg_cell_counts;  // 시군구별 전체 격자 수 (scripts/04가 넣어줌)
  const s = {};
  geojson.features.forEach(f => {
    const p = f.properties;
    if (crit === 'filtered' && !activeKeys.has(p.tier)) return;
    const key = p.sido_nm + '|' + p.sgg_nm;
    if (!s[key]) s[key] = { count: 0, weight: 0 };
    s[key].count++;
    s[key].weight += TIER_ORDER.indexOf(p.tier) + 1;
  });
  const n = v => v.toLocaleString('ko-KR');
  renderRankRows(Object.entries(s).map(([key, v]) => {
    const ratio = v.count / totals[key];
    if (crit === 'ratio')    return { key, score: ratio, count: v.count, val: `${(ratio*100).toFixed(1)}% <span class="unit">(${n(v.count)}/${n(totals[key])})</span>` };
    if (crit === 'weighted') return { key, score: v.weight, count: v.count, val: `${n(v.weight)}점` };
    return { key, score: v.count, count: v.count, val: `${n(v.count)}개` };
  }).sort((a,b) => b.score - a.score || b.count - a.count).slice(0,10));
}

// ---- 탭 / 연도 선택 ----
function setMode(next){
  if (mode === next) return;
  mode = next;
  const isStatus = mode === 'status';
  document.getElementById('tab-change').setAttribute('aria-selected', String(!isStatus));
  document.getElementById('tab-status').setAttribute('aria-selected', String(isStatus));
  document.getElementById('year-picker').hidden = !isStatus;
  document.getElementById('rank-picker').hidden = !isStatus;
  document.getElementById('panel-title').textContent = isStatus ? '거점 현황 지도' : '거점 등급 변화 지도';
  document.getElementById('stat-label').textContent = isStatus ? '중심지 격자 수' : '등급 변화 격자 수';
  document.getElementById('legend-title').textContent = isStatus ? '중심지 등급 (클릭해 필터)' : '등급 변화 (클릭해 필터)';
  document.getElementById('rank-title').textContent = isStatus ? '중심지 상위 시군구' : '변화 상위 시군구';
  updateSubtitle();
  loadAndRender();
}

function updateSubtitle(){
  document.getElementById('panel-sub').textContent = mode === 'status'
    ? `${year}년 시점의 국토공간거점 등급 분포 (주변부 제외)`
    : '2021 → 2025년 사이 국토공간거점 등급이 오르내린 격자 (VWorld 베이스맵)';
}

document.getElementById('tab-change').addEventListener('click', () => setMode('change'));
document.getElementById('tab-status').addEventListener('click', () => setMode('status'));
document.getElementById('rank-select').addEventListener('change', () => buildRankList(currentGeojson));
document.getElementById('year-select').addEventListener('change', (e) => {
  year = e.target.value;
  updateSubtitle();
  loadAndRender();
});

loadAndRender();
</script>
